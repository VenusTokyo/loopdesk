# One command to get the whole demo: `docker compose up --build`
# Then open http://localhost:8000/demo/
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults that make a clean clone work with no configuration at all.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/loopdesk.db}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
    volumes:
      - ./data:/app/data
      - ./solutions:/app/solutions
    command: >
      sh -c "python -m backend.seed.seed &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  # Optional: Postgres with pgvector, for the production-shaped setup.
  # Start it with `docker compose --profile postgres up --build` and set
  # DATABASE_URL=postgresql+psycopg://loopdesk:loopdesk@db:5432/loopdesk
  db:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: loopdesk
      POSTGRES_PASSWORD: loopdesk
      POSTGRES_DB: loopdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
