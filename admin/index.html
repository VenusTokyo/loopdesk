<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopDesk admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23faff69' stroke-width='5' stroke-dasharray='56 20' transform='rotate(-30 16 16)'/></svg>">
<style>
  :root {
    --canvas:#0a0a0a; --soft:#121212; --card:#1a1a1a; --elev:#242424;
    --hair:#2a2a2a; --hair2:#3a3a3a; --y:#faff69; --y2:#e6eb52;
    --ink:#fff; --body:#ccc; --muted:#888; --ok:#22c55e; --bad:#ef4444;
    --sans: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--body); font:400 15px/1.55 var(--sans); }

  header {
    background:var(--card); border-bottom:1px solid var(--hair); padding:14px 24px;
    display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5;
  }
  header h1 { font-size:17px; margin:0; flex:1; color:var(--ink); font-weight:700; letter-spacing:-.4px;
              display:flex; align-items:center; gap:10px; }
  .mark { width:20px; height:20px; border:3px solid var(--y); border-radius:50%;
          border-right-color:transparent; transform:rotate(-30deg); flex:none; }
  main { max-width:960px; margin:32px auto; padding:0 24px; }

  .card { background:var(--card); border:1px solid var(--hair); border-radius:12px; padding:20px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--hair); border-radius:12px; padding:16px; }
  .stat b { display:block; font-size:30px; color:var(--y); line-height:1; letter-spacing:-1px; font-weight:700; }
  .stat span { display:block; margin-top:8px; font-size:11px; color:var(--muted);
               text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  h2 { font-size:15px; margin:32px 0 12px; color:var(--ink); font-weight:600; }

  input[type=text], textarea, input[type=password] {
    width:100%; font:400 14px/1.5 var(--sans); padding:10px 12px;
    background:var(--elev); border:1px solid var(--hair); border-radius:8px; color:var(--ink);
  }
  textarea { resize:vertical; font-family:var(--mono); font-size:13px; }
  input:focus, textarea:focus { outline:0; border-color:var(--y); }
  label { display:block; font:600 11px var(--sans); color:var(--muted); margin:12px 0 5px;
          text-transform:uppercase; letter-spacing:.06em; }

  button {
    font:600 14px var(--sans); padding:9px 15px; border-radius:8px;
    border:1px solid var(--hair2); background:var(--elev); color:var(--ink); cursor:pointer;
  }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--y); border-color:var(--y); color:#0a0a0a; }
  button.primary:hover { background:var(--y2); border-color:var(--y2); }
  button.danger { background:transparent; border-color:rgba(239,68,68,.5); color:var(--bad); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--y); outline-offset:2px; }
  .row { display:flex; gap:8px; margin-top:14px; }

  .chip { font:500 11px var(--mono); padding:2px 9px; border-radius:9999px;
          background:var(--elev); border:1px solid var(--hair2); color:var(--ink); margin-right:6px; }
  .chip.y { background:var(--y); border-color:var(--y); color:#0a0a0a; }
  .muted { color:var(--muted); font-size:13px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--hair); }
  th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  tbody tr:last-child td { border-bottom:0; }
  a { color:var(--y); }

  .banner { padding:11px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; border-left:2px solid; }
  .banner.ok { background:rgba(250,255,105,.08); color:var(--ink); border-left-color:var(--y); }
  .banner.bad { background:rgba(239,68,68,.09); color:#fca5a5; border-left-color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1><span class="mark"></span>LoopDesk admin</h1>
  <input type="password" id="token" placeholder="admin token" style="width:200px">
  <button id="reload" class="primary">Load</button>
</header>

<main>
  <div id="msg"></div>
  <div class="stats" id="stats"></div>

  <h2>Drafts awaiting approval</h2>
  <div id="drafts"><p class="muted">Enter the admin token and press Load.</p></div>

  <h2>Tickets</h2>
  <div class="card"><div id="tickets"><p class="muted">-</p></div></div>

  <h2>Published knowledge base</h2>
  <div class="card"><div id="published"><p class="muted">-</p></div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'loopdesk.admin.token';

function token() { return $('token').value.trim(); }

async function api(path, body) {
  const res = await fetch('/api/admin' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token() },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(res.status === 401 ? 'Wrong admin token.' : `Request failed (${res.status})`);
  return res.json();
}

function note(text, bad) {
  $('msg').innerHTML = text ? `<div class="banner ${bad ? 'bad' : 'ok'}">${text}</div>` : '';
}

function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  });
  (kids || []).forEach((c) => c && n.appendChild(c));
  return n;
}

async function loadAll() {
  try {
    localStorage.setItem(TOKEN_KEY, token());
    note('');
    const [stats, drafts, tickets, all] = await Promise.all([
      api('/stats'), api('/drafts'), api('/tickets'), api('/solutions'),
    ]);
    renderStats(stats);
    renderDrafts(drafts);
    renderTickets(tickets);
    renderPublished(all.filter((s) => s.status === 'published'));
  } catch (err) {
    note(err.message, true);
  }
}

function renderStats(s) {
  $('stats').innerHTML = '';
  const cells = [
    ['Reports', s.reports], ['Tickets', s.tickets],
    ['Deflected', `${s.deflected} (${Math.round(s.deflection_rate * 100)}%)`],
    ['Helpful', s.helpful_ratings], ['Published', s.published_solutions], ['Drafts', s.draft_solutions],
  ];
  cells.forEach(([label, value]) => {
    $('stats').appendChild(el('div', { class: 'stat' }, [
      el('b', { text: String(value) }), el('span', { text: label }),
    ]));
  });
}

function renderDrafts(rows) {
  const host = $('drafts');
  host.innerHTML = '';
  if (!rows.length) { host.appendChild(el('p', { class: 'muted', text: 'No drafts. Close a LoopDesk ticket in GitHub to generate one.' })); return; }

  rows.forEach((d) => {
    const title = el('input', { type: 'text', value: d.title });
    const summary = el('textarea', { rows: '2' }); summary.value = d.summary || '';
    const steps = el('textarea', { rows: '6' }); steps.value = d.steps_md || '';

    const card = el('div', { class: 'card' }, [
      el('div', {}, [
        el('span', { class: 'chip', text: d.subproduct }),
        d.source_issue_number ? el('span', { class: 'chip', text: `issue #${d.source_issue_number}` }) : null,
        d.applies_from ? el('span', { class: 'chip', text: `from v${d.applies_from}` }) : null,
      ]),
      el('label', { text: 'Title' }), title,
      el('label', { text: 'Summary' }), summary,
      el('label', { text: 'Steps (markdown)' }), steps,
      el('div', { class: 'row' }, [
        el('button', {
          class: 'primary', text: 'Approve and publish',
          onclick: async () => {
            try {
              const r = await api('/approve', {
                solution_id: d.id, title: title.value, summary: summary.value, steps_md: steps.value,
              });
              note(`Published. Committed to ${r.path}${r.committed ? '' : ' (written locally - no GitHub token)'}.`);
              loadAll();
            } catch (err) { note(err.message, true); }
          },
        }),
        el('button', {
          class: 'danger', text: 'Reject',
          onclick: async () => {
            try { await api('/reject', { solution_id: d.id }); note('Draft rejected.'); loadAll(); }
            catch (err) { note(err.message, true); }
          },
        }),
      ]),
    ]);
    host.appendChild(card);
  });
}

function renderTickets(rows) {
  const host = $('tickets');
  host.innerHTML = '';
  if (!rows.length) { host.appendChild(el('p', { class: 'muted', text: 'No tickets yet.' })); return; }
  const table = el('table', {}, [
    el('thead', {}, [el('tr', {}, ['#', 'Title', 'Sub-product', 'Status', ''].map((t) => el('th', { text: t })))]),
  ]);
  const tbody = el('tbody');
  rows.forEach((t) => {
    tbody.appendChild(el('tr', {}, [
      el('td', { text: t.number ? `#${t.number}` : '-' }),
      el('td', { text: t.title }),
      el('td', { text: t.subproduct }),
      el('td', { text: t.status + (t.dry_run ? ' (dry-run)' : '') }),
      el('td', {}, [t.url ? el('a', { href: t.url, target: '_blank', rel: 'noopener', text: 'open' }) : null]),
    ]));
  });
  table.appendChild(tbody);
  host.appendChild(table);
}

function renderPublished(rows) {
  const host = $('published');
  host.innerHTML = '';
  if (!rows.length) { host.appendChild(el('p', { class: 'muted', text: 'Knowledge base is empty. Run the seed script.' })); return; }
  const table = el('table', {}, [
    el('thead', {}, [el('tr', {}, ['Title', 'Sub-product', 'Source', 'Helpful', 'Not helpful', 'Ticket after'].map((t) => el('th', { text: t })))]),
  ]);
  const tbody = el('tbody');
  rows.forEach((s) => {
    tbody.appendChild(el('tr', {}, [
      el('td', { text: s.title }),
      el('td', { text: s.subproduct }),
      el('td', { text: s.source_issue_number ? `#${s.source_issue_number}` : s.source }),
      el('td', { text: String(s.helpful_count) }),
      el('td', { text: String(s.unhelpful_count) }),
      el('td', { text: String(s.ticket_after_count) }),
    ]));
  });
  table.appendChild(tbody);
  host.appendChild(table);
}

$('reload').addEventListener('click', loadAll);
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadAll(); });
$('token').value = localStorage.getItem(TOKEN_KEY) || '';
if ($('token').value) loadAll();
</script>
</body>
</html>
